services:
  postgres:
    # Dieselbe Major-Version wie auf Railway. Ein lokaler Test auf 16 gegen
    # Produktion auf 17 verschiebt Fehler nur nach hinten.
    image: postgres:17-alpine
    container_name: mastra-postgres
    environment:
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
      POSTGRES_DB: mastra
    ports:
      # Nach aussen gemappt, damit `npm run db:generate` und die Tests von
      # ausserhalb des Compose-Netzes drankommen.
      - "5432:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mastra:
    build: .
    container_name: mastra-app
    ports:
      - "4111:4111"
    # Migrationen laufen vor dem Start, genau wie auf Railway (preDeployCommand).
    # Kein `npm run`: das Laufzeit-Image enthält nur .mastra/output, keine
    # package.json und kein npm-Skript. Derselbe Aufruf wie Railways
    # preDeployCommand in railway.json.
    command: sh -c "node .mastra/output/scripts/migrate.mjs && node .mastra/output/index.mjs"
    env_file:
      - .env
    environment:
      # Servicename statt localhost: die Verbindung passiert im Compose-Netz.
      DATABASE_URL: postgres://mastra:mastra@postgres:5432/mastra
      # Host CA bundle includes the corporate TLS-interception CA;
      # without it, HTTPS from inside the container fails cert verification.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      # Erlaubt dem Browser den direkten Weg zu Mastra (siehe README, Variante B).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # Fachdaten laufen ueber den API-Dienst, nicht mehr direkt ueber Drizzle.
      # Servicename statt localhost: der Aufruf passiert im Compose-Netz.
      API_URL: http://api:4000
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-lokaler-test-token-mindestens-32-zeichen-lang}
    volumes:
      # Persistiert die hochgeladenen Belege und die erzeugten JSON-Dateien.
      # Threads, Memory, Traces und Workflow-Snapshots liegen jetzt in Postgres.
      - ./data:/app/data
      # Live-Reload gibt es hier nicht: das Image ist ein Produktions-Build
      # (mastra build -> node .mastra/output/index.mjs). Für Live-Reload lokal
      # `npm run dev` außerhalb von Docker benutzen.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz prüft zusätzlich die Datenbankverbindung; /api und das
      # eingebaute /health sagen nur, dass der Prozess steht.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4111/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    # Kontext ist das Repo-Root, nicht ./api: der Dienst ist ein npm-Workspace
    # dieses Repos und importiert Schema und Repository aus src/db.
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: receipt-api
    ports:
      - "4000:4000"
    environment:
      # Dieselbe Instanz wie der Agent, eigener kleiner Pool. Der Dienst
      # migriert nichts - das macht der Agent-Service beim Start.
      DATABASE_URL: postgres://mastra:mastra@postgres:5432/mastra
      DB_POOL_MAX: 5
      # Lokal ein fester Wert, auf Railway ein Secret. Der Agent muss denselben
      # benutzen, sonst bekommt er 401.
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-lokaler-test-token-mindestens-32-zeichen-lang}
      # Ohne diese zwei funktioniert nur der Service-Weg; Nutzertoken werden
      # dann mit 401 abgewiesen (und der Grund steht im Log).
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:-}
      # Wechselkurse fuer die Abrechnungswaehrung. Servicename statt localhost.
      FRANKFURTER_URL: http://frankfurter:8080
    depends_on:
      postgres:
        condition: service_healthy
      # Nur gestartet, nicht gesund: ohne Frankfurter laeuft der Dienst weiter,
      # es fehlen dann nur die umgerechneten Betraege. Und Frankfurters eigener
      # Healthcheck hat 5 Minuten Startfrist - darauf zu warten hielte den
      # ganzen Stack auf.
      frankfurter:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frankfurter:
    # Wechselkurse (https://frankfurter.dev), selbst gehostet. Nur der
    # API-Dienst spricht mit ihm; er cached jeden Kurs in app.exchange_rates.
    #
    # Beim ersten Start fuellt Frankfurter seine SQLite-Datenbank aus den
    # Quellen der Zentralbanken nach. Bis das durch ist (Minuten, je nach
    # Quelle laenger), antwortet er fuer manche Waehrungen mit 404 - die
    # Abrechnung zeigt dann "Rate unavailable" und holt es spaeter nach.
    image: lineofflight/frankfurter
    container_name: frankfurter
    init: true
    ports:
      # Nach aussen, damit `npm run dev --workspace api` auf dem Host ihn unter
      # dem Default http://localhost:8080 findet.
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:///app/data/frankfurter.sqlite3
    volumes:
      # Ohne Volume beginnt der Backfill bei jedem Neustart von vorn.
      - ./data/frankfurter:/app/data
    restart: unless-stopped

  frontend:
    # Kontext ist das Repo-Root, nicht ./frontend: das Frontend ist ein
    # npm-Workspace dieses Repos und baut gegen das Lockfile des Roots.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: receipt-frontend
    ports:
      - "3000:3000"
    environment:
      # KEIN DATABASE_URL: das Frontend hat keine Datenbankverbindung mehr.
      # Alle Belegdaten kommen ueber den API-Dienst.
      API_URL: http://api:4000
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-lokaler-test-token-mindestens-32-zeichen-lang}
      # Nur fuer die Belegbilder: die liegen im Datenverzeichnis des Agenten.
      # Servicename statt localhost, der Aufruf passiert im Container.
      MASTRA_URL: http://mastra:4111
      # Anmeldung. Ohne diese Werte kommt man nicht ueber /signin hinaus - der
      # Rest des Stacks laeuft trotzdem, deshalb keine Pflichtvariablen mit ":?".
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
      TEAMS_CHAT_URL: ${TEAMS_CHAT_URL:-}
    depends_on:
      api:
        condition: service_healthy
      mastra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
