services:
  postgres:
    # Dieselbe Major-Version wie auf Railway. Ein lokaler Test auf 16 gegen
    # Produktion auf 17 verschiebt Fehler nur nach hinten.
    image: postgres:17-alpine
    container_name: mastra-postgres
    environment:
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
      POSTGRES_DB: mastra
    ports:
      # Nach aussen gemappt, damit `npm run db:generate` und die Tests von
      # ausserhalb des Compose-Netzes drankommen.
      - "5432:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mastra:
    build: .
    container_name: mastra-app
    ports:
      - "4111:4111"
    # Migrationen laufen vor dem Start, genau wie auf Railway (preDeployCommand).
    # Kein `npm run`: das Laufzeit-Image enthält nur .mastra/output, keine
    # package.json und kein npm-Skript. Derselbe Aufruf wie Railways
    # preDeployCommand in railway.json.
    command: sh -c "node .mastra/output/scripts/migrate.mjs && node .mastra/output/index.mjs"
    env_file:
      - .env
    environment:
      # Servicename statt localhost: die Verbindung passiert im Compose-Netz.
      DATABASE_URL: postgres://mastra:mastra@postgres:5432/mastra
      # Host CA bundle includes the corporate TLS-interception CA;
      # without it, HTTPS from inside the container fails cert verification.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      # Erlaubt dem Browser den direkten Weg zu Mastra (siehe README, Variante B).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      # Persistiert die hochgeladenen Belege und die erzeugten JSON-Dateien.
      # Threads, Memory, Traces und Workflow-Snapshots liegen jetzt in Postgres.
      - ./data:/app/data
      # Live-Reload gibt es hier nicht: das Image ist ein Produktions-Build
      # (mastra build -> node .mastra/output/index.mjs). Für Live-Reload lokal
      # `npm run dev` außerhalb von Docker benutzen.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz prüft zusätzlich die Datenbankverbindung; /api und das
      # eingebaute /health sagen nur, dass der Prozess steht.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4111/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    # Kontext ist das Repo-Root, nicht ./frontend: das Frontend ist ein
    # npm-Workspace dieses Repos und importiert das Drizzle-Schema aus src/db.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: receipt-frontend
    ports:
      - "3000:3000"
    environment:
      # Dieselbe Instanz wie der Agent, eigener kleiner Pool. Das Frontend
      # migriert nichts - das macht der Agent-Service beim Start.
      DATABASE_URL: postgres://mastra:mastra@postgres:5432/mastra
      FRONTEND_DB_POOL_MAX: 3
      # Nur fuer die Belegbilder: die liegen im Datenverzeichnis des Agenten.
      # Servicename statt localhost, der Aufruf passiert im Container.
      MASTRA_URL: http://mastra:4111
    depends_on:
      postgres:
        condition: service_healthy
      mastra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
